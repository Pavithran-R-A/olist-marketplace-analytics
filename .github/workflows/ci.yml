name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OLIST_DATA_DIR: tests/fixtures
      OLIST_PROCESSED_DIR: tests/fixture_processed
      OLIST_PUBLISHED_DIR: tests/fixture_published
      OLIST_DB_PATH: tests/fixture_processed/olist.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m src.transform
      - run: python -m src.validate
      - run: python -m src.analyse
      - run: python -m src.build_dashboard_data
      - run: python -m src.dashboard
      - run: pytest
