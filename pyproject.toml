[project]
name = "olist-marketplace-analytics"
version = "0.1.0"
description = "GMV, fulfillment, and customer experience analytics for Olist."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "plotly>=5.24",
  "scipy>=1.13",
  "kagglehub>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

